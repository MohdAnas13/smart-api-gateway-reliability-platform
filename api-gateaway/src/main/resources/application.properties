spring.application.name=api-gateaway
server.port=8080

# Downstream service
gateway.user-service-url=${GATEWAY_USER_SERVICE_URL:http://localhost:8081}

# API key
gateway.api-key=${GATEWAY_API_KEY:anas-secret-key}

# Actuator
management.endpoints.web.exposure.include=health,metrics

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.usersCircuit.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.usersCircuit.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.usersCircuit.sliding-window-size=10
resilience4j.circuitbreaker.instances.usersCircuit.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.usersCircuit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usersCircuit.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.usersCircuit.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.usersCircuit.automatic-transition-from-open-to-half-open-enabled=true

# Downstream timeouts (verify support for the Web MVC gateway)
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=3s

logging.level.org.springframework.cloud.gateway.server.mvc=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG